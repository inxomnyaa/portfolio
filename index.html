<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Live 3D portfolio of inxomnyaa: Minecraft and Hytale models, animations and particle effects.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>inxomnyaa Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script>window.libsReady = new Promise(r => { window.__libsDone = r; });</script>
<script type="module">
  import * as T from 'https://cdn.jsdelivr.net/npm/three@0.134.0/+esm';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.134.0/examples/jsm/controls/OrbitControls.js/+esm';
  window.THREE = Object.assign({}, T, { OrbitControls });
  try { window.Wintersky = (await import('https://cdn.jsdelivr.net/npm/wintersky@1.4.0/+esm')).default; }
  catch (e) { console.error('Wintersky failed to load', e); }
  window.__libsDone();
</script>
<style>
  /* Layout: dark plum stage band (intro | live 3D | featured reel), then three columns: filters | grid | projects. */
  :root {
    --bg: #f4f1f8; --surface: #ffffff; --line: #ddd5e8; --fg: #1e1828; --muted: #655b74;
    --accent: #7448c9; --accent-fg: #ffffff;
    --night: #151020; --night-2: #1f1830; --night-fg: #efe9f8; --night-muted: #b3a6c8; --glow: #6a3fbf;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #110d18; --surface: #1a1424; --line: #2f2640; --fg: #ece6f5; --muted: #a497b8; --accent: #a986ff; --accent-fg: #170f26; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #110d18; --surface: #1a1424; --line: #2f2640; --fg: #ece6f5; --muted: #a497b8; --accent: #a986ff; --accent-fg: #170f26; color-scheme: dark }
  body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
  .gutter { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1680px; margin: 0 auto; }

  /* stage band */
  .band { background: radial-gradient(90% 120% at 55% 50%, color-mix(in srgb, var(--glow) 38%, var(--night)) 0%, var(--night) 62%); color: var(--night-fg); }
  .band { position: relative; overflow: hidden; }
  .band .stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    /* keep the stars away from the intro text (middle column) */
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 14%, rgb(0 0 0 / .08) 26%, rgb(0 0 0 / .08) 56%, #000 70%);
            mask-image: linear-gradient(to right, #000 0%, #000 14%, rgb(0 0 0 / .08) 26%, rgb(0 0 0 / .08) 56%, #000 70%); }
  @media (max-width: 860px) { .band .stars { -webkit-mask-image: none; mask-image: none; opacity: .5; } }
  .band .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: auto minmax(280px, 480px) minmax(320px, 1fr); gap: 36px; padding-block: 26px; align-items: center; }
  .me { width: clamp(180px, 17vw, 250px); aspect-ratio: 3 / 4; border-radius: 22px; overflow: hidden; display: grid; place-items: center;
    background: color-mix(in srgb, var(--night-fg) 8%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--night-fg) 16%, transparent), 0 24px 60px rgb(0 0 0 / .35); }
  .me img { width: 100%; height: 100%; object-fit: cover; }
  @media (min-width: 861px) { .band.no-photo .wrap { grid-template-columns: minmax(280px, 520px) minmax(320px, 1fr); } }
  .me span { color: var(--night-muted); font-size: .85rem; text-align: center; padding: 12px; }
  .intro { display: grid; gap: 14px; align-content: center; min-width: 0; }
  .eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--night-muted); }
  .intro h1 { font-size: clamp(2.3rem, 4vw, 3.6rem); line-height: .95; font-weight: 800; }
  .intro p { margin: 0; color: color-mix(in srgb, var(--night-fg) 88%, transparent); font-size: .98rem; }
  .icons { display: flex; flex-wrap: wrap; gap: 6px; }
  .icons a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; color: var(--night-fg); text-decoration: none; font-size: .85rem;
    background: color-mix(in srgb, var(--night-fg) 9%, transparent); }
  .icons a:hover { background: color-mix(in srgb, var(--night-fg) 18%, transparent); }
  .icons svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
  .stage { position: relative; min-height: 380px; height: clamp(380px, 46vh, 520px); min-width: 0; }
  .stage .viewer3d { position: absolute; inset: 0; pointer-events: none; touch-action: auto; }  /* display only: never blocks scrolling */
  .stage-cap { position: absolute; right: 8px; bottom: 4px; pointer-events: none; display: grid; text-align: right; }
  .stage-cap b { font-family: var(--display); font-size: 1.35rem; }
  .stage-cap span { color: var(--night-muted); font-size: .88rem; }
  .stage-ctl { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 6px; }
  .stage-ctl button { padding: 6px 12px; border-radius: 999px; border: 0; background: color-mix(in srgb, var(--night-fg) 14%, transparent); color: var(--night-fg); font-size: .85rem; }
  .stage-ctl button:hover { background: color-mix(in srgb, var(--night-fg) 24%, transparent); }

  /* three columns */
  .cols { display: grid; grid-template-columns: 210px minmax(0, 1fr) 290px; gap: 26px; padding-block: 26px 56px; align-items: start; }
  .side-l, .side-r { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 18px; align-content: start;
    max-height: calc(100vh - 32px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; padding-right: 4px; }
  .side-l h3, .side-r h3 { font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-family: var(--body); font-weight: 700; }
  .search { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .opts { display: grid; gap: 4px; }
  .opt { display: flex; justify-content: space-between; gap: 8px; text-align: left; padding: 6px 10px; border-radius: 8px; border: 0; background: transparent; color: var(--fg); }
  .opt:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .opt small { color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }
  .count { color: var(--muted); font-size: .9rem; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; }
  .tile { display: grid; grid-template-rows: auto 1fr; align-content: start; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); color: var(--fg);
    transition: transform .15s ease, border-color .15s ease; }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  .pic { aspect-ratio: 1; display: grid; place-items: center; position: relative;
    background: radial-gradient(circle at 50% 45%, var(--night-2) 0%, var(--night) 75%); }
  .pic { overflow: hidden; }
  .pic img { width: 86%; height: 86%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 0 14px rgb(190 160 255 / .28)); }
  .pic.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: auto; filter: none; }
  .pic.vfx img { width: 42%; height: 42%; filter: drop-shadow(0 0 12px rgba(255, 255, 255, .45)); }
  .badges { position: absolute; top: 7px; left: 7px; display: flex; gap: 4px; z-index: 2; }
  .badge { backdrop-filter: blur(4px); box-shadow: 0 1px 4px rgb(0 0 0 / .35); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: rgb(255 255 255 / .14); color: #f3eefb; }
  .badge.wip { background: #e0a32e; color: #241500; }
  .meta { padding: 8px 11px 11px; display: grid; gap: 1px; min-width: 0; }
  .meta b { font-family: var(--display); font-weight: 600; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta small { color: var(--muted); }
  .empty { color: var(--muted); }
  .proj { display: grid; gap: 4px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .proj[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .proj b { font-family: var(--display); font-size: 1.05rem; display: flex; justify-content: space-between; gap: 8px; }
  .proj b small { font-family: var(--body); color: var(--muted); font-weight: 400; font-size: .85rem; }
  .proj span { color: var(--muted); font-size: .9rem; }
  .proj a { color: var(--accent); font-size: .88rem; }
  footer { padding-block: 0 40px; color: var(--muted); font-size: .88rem; }

  /* dialog */
  dialog { border: 0; padding: 0; border-radius: 16px; width: min(1180px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); }
  dialog::backdrop { background: rgb(10 6 16 / .75); }
  .insp { display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: minmax(0, 1fr); height: min(78vh, 720px); }
  .insp .viewer3d, .insp .media { height: 100%; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, var(--night-2) 0%, var(--night) 75%); }
  .viewer3d { touch-action: none; }
  .viewer3d canvas { display: block; width: 100%; height: 100%; }
  .insp .media { display: grid; place-items: center; }
  .insp .media { min-height: 0; }
  .insp .media img, .insp .media video, .insp .media iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .insp .media .yt-out { position: absolute; inset: 0; display: grid; place-items: center; }
  .insp .media .yt-out img { object-fit: cover; }
  .insp .media .wm { position: absolute; right: 14px; bottom: 12px; color: #fff; opacity: .55; font-size: .85rem; font-weight: 700; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .insp .media img.pixel { width: 100%; height: 100%; image-rendering: pixelated; }
  .insp .media iframe { width: 100%; height: 100%; border: 0; }
  .yt-out { position: relative; display: grid; place-items: center; width: 100%; height: 100%; color: #fff; text-decoration: none; }
  .yt-out img { width: 100%; height: 100%; object-fit: cover; opacity: .75; }
  .yt-out span { position: absolute; padding: 10px 18px; border-radius: 999px; background: #c4302b; font-weight: 700; }
  .dside { padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; height: 100%; box-sizing: border-box; }
  .desc { flex: 1 1 auto; min-height: 0; overflow: auto; font-size: .95rem; }
  .desc h4 { font-family: var(--display); font-size: 1.05rem; margin: 12px 0 4px; }
  .desc p { margin: 0 0 8px; } .desc ul { margin: 0 0 8px; padding-left: 20px; } .desc a { color: var(--accent); }
  .desc code { font-size: .88em; padding: 1px 4px; border-radius: 4px; background: color-mix(in srgb, var(--fg) 8%, transparent); }
  .navrow { margin-top: auto; }
  .dside h2 { font-size: 1.5rem; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: .8rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.wip { border-color: #e0a32e; color: #b07a12; }
  .dside p { margin: 0; }
  label.anim { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .navrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .hint { color: var(--muted); font-size: .82rem; }
  /* edit mode (#edit, local editor server) */
  .editbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 16px; background: #e0a32e; color: #241500; font-weight: 700; }
  .editbar button { padding: 4px 12px; border-radius: 8px; border: 0; background: #241500; color: #ffe8b8; font-weight: 700; }
  .editbar span { font-weight: 400; }
  .edit { display: grid; gap: 8px; font-size: .9rem; }
  .edit label { display: grid; gap: 3px; color: var(--muted); }
  .edit input[type=text], .edit textarea { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .edit textarea { min-height: 110px; resize: vertical; }
  .edit .checks { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--fg); }
  .edit .checks label { display: flex; gap: 4px; align-items: center; color: var(--fg); }
  .edit .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .adddlg { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 18px; }
  .adddlg::backdrop { background: rgba(8, 4, 16, .7); }
  .adddlg h2 { font-family: var(--display); font-size: 1.3rem; margin: 0 0 4px; }
  .adddlg .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); }
  .adddlg .drop.on { border-color: var(--accent); color: var(--fg); }
  .edit .save { padding: 6px 14px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; }

  @media (max-width: 1180px) {
    .cols { grid-template-columns: 200px minmax(0, 1fr); }
    /* narrow screens: projects become a swipeable row above the grid instead of a column at the very end */
    .side-r { order: -1; position: static; max-height: none; overflow: visible; grid-column: 1 / -1; display: grid; gap: 10px; min-width: 0; padding-right: 0; }
    #projects { display: flex !important; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; overscroll-behavior-x: contain;
      padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #projects .proj { scroll-snap-align: start; align-content: start; }
    #projects .proj { padding: 7px 12px; border-radius: 999px; flex: 0 0 auto; }
    #projects .proj b { font-size: .92rem; gap: 6px; white-space: nowrap; }
    #projects .proj span, #projects .proj a { display: none; }  /* names + counts only: the grid should start right away */
    .side-r h3 { display: none; }
  }
  @media (max-width: 860px) {
    .band .wrap { grid-template-columns: minmax(0, 1fr); }
    .stage { height: 380px; min-height: 0; margin-inline: calc(-1 * max(20px, env(safe-area-inset-left, 0px))) calc(-1 * max(20px, env(safe-area-inset-right, 0px))); }
    .stage-cap { right: max(20px, env(safe-area-inset-right, 0px)); }
    .me { width: 170px; justify-self: center; }
    .cols { grid-template-columns: minmax(0, 1fr); }
    .side-l { position: static; max-height: none; overflow: visible; }
    .opts { display: flex; flex-wrap: wrap; }
    .insp { grid-template-columns: minmax(0, 1fr); grid-template-rows: 48vh minmax(0, 1fr); height: 90vh; }
    .insp .viewer3d, .insp .media { height: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>

  </div>
</dialog>

<script>
// pixel starfield behind the stage band: drawn at 1/4 resolution and scaled up with pixelated rendering
(() => {
  // simulation runs in a coarse "sky pixel" grid (PX css px per star pixel), drawing happens at full device resolution
  // so motion is smooth while the stars stay crisp squares
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d'), PX = 4;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [], S = 1, W = 1, H = 1;
  function setup() {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    S = PX * dpr; W = Math.max(1, Math.ceil(r.width / PX)); H = Math.max(1, Math.ceil(r.height / PX));
    // Minecraft-like night sky: plain white squares, 1-2 px (x4 on screen), varying brightness, slowly drifting
    const n = Math.round(W * H / 380);
    stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H,
      s: Math.random() < 0.15 ? 2 : 1, a: 0.2 + Math.random() * 0.45,
      tw: Math.random() < 0.35, sp: 0.5 + Math.random() * 1.5, ph: Math.random() * 6.28 }));
    draw(0);
  }
  // shooting star: spawns every 6-14 s, crosses diagonally in ~0.9 s with a fading pixel trail
  let shot = null, nextShot = 4000 + Math.random() * 6000;
  function spawn(t) {
    const fromLeft = Math.random() < 0.5, ang = (fromLeft ? 1 : -1) * (0.35 + Math.random() * 0.3);
    shot = { t0: t, dur: 800 + Math.random() * 500, x: W * (fromLeft ? 0.1 + Math.random() * 0.4 : 0.5 + Math.random() * 0.4),
      y: H * Math.random() * 0.35, vx: Math.cos(ang) * (fromLeft ? 1 : -1) * W * 0.45, vy: Math.abs(Math.sin(ang)) * W * 0.45 };
    nextShot = t + 6000 + Math.random() * 8000;
  }
  function draw(t) {
    ctx.clearRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#ffffff';
    const d = t / 1000 * (still ? 0.6 : 1.2);   // slow drift like the sky turning, slightly tilted
    const dx = d * 0.96, dy = d * 0.28;
    for (const s of stars) {
      const x = ((s.x - dx) % W + W) % W;
      const y = ((s.y - dy) % H + H) % H;
      ctx.globalAlpha = s.tw && !still ? s.a * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t / 1000 * s.sp + s.ph))) : s.a;
      ctx.fillRect(Math.round(x * S), Math.round(y * S), Math.round(s.s * S), Math.round(s.s * S));
    }

ments/717057798684540988/1077295971765076050/Avoyd_2022-03-05_13-46_world_0_PathTraced_Denoised.png?width=1168&height=657\nhttps://media.discordapp.net/attachments/851372045420986418/1051242851104723054/image.png?width=1092&height=657\nhttps://media.discordapp.net/attachments/851372045420986418/949623131725770812/unknown.png\n@\ud83d\udd14 Development Update @Builder\n\n[...]", "date": "2023-02", "category": "Our Main World So Far", "kind": "image", "src": "media/discord/our-main-world-so-far-3.jpg", "thumb": "media/discord/our-main-world-so-far-3-thumb.jpg", "pixel": false, "types": ["Screenshot", "Builds & Worlds"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udcbbdevelopment-updates - \ud83e\udd70 Bringing Characters to Life_ Emotions & World-Building \ud83e\udd94 - _t_1730923260_D_ [1303812354085228634].json_Files/profile_ui-553d40af01633f96.png", "title": "Profile Ui", "desc": "### \ud83d\udda5\ufe0f **Updated Profile & Settings UI**\nOur profile and settings interface is getting a visual overhaul! Expect a more intuitive experience - stay tuned for a showcase soon.\n\n### \ud83d\udd2e **Future Updates**\nWe\u2019re planning to switch back to smaller, more frequent updates to keep things manageable (trust us, this one got a bit out of hand - oh, the version management! :fearful:).\n\nWe hope you\u2019re enjoying this **@\ud83d\udd14 Development Update** and our fresh approach to showcasing our progress! Thank you for following along, and stay tuned for more regular insights into the world we\u2019re building. \ud83d\udc96", "date": "2024-11", "category": "Bringing Characters to Life: Emotions & World-Building", "kind": "image", "src": "media/discord/bringing-characters-to-life-emotions-world-building-profile-ui.jpg", "thumb": "media/discord/bringing-characters-to-life-emotions-world-building-profile-ui-thumb.jpg", "pixel": false, "types": ["Render"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udcbbdevelopment-updates - \ud83d\uddfaUIs, Story and World - _t_1700562960_D_ [1176488405450887190].json_Files/quest_book-1f85b21cc320ba2b.gif", "title": "Quest Book", "desc": "We're excited to share the latest developments in the WolvesFortress realm! The main objective and story arc have been solidified, giving the world a clear direction. The nations and inhabitants have undergone a complete replanning to align with these fresh story ideas.\n\n**Client Side Changes:**\n- \ud83d\udd27 Rewritten and cleaned up all JSON UI files, now split into individual files for easier readability and modification.\n- \ud83d\udcc8 Reduced memory peaks and lags, enhancing the load and response times of all UIs.\n- \ud83d\udcac Redesigned NPC dialogues to a scroll format, removing the skin renderer for better immersion.\n- \ud83d\udcd3 Updated the book UI to better reflect the original concept, experimenting with a page flip animation.\n- \ud83d\udea9 Revised button design (Note: NPC dialogue text cut-off [MCPE-176550](https://bugs.mojang.com/browse/MCPE-176550)).\n- \u2699\ufe0f Introduced an interface for settings and information, covering game log, friends, guilds, skills, etc.\n- \u2714\ufe0f Fixed titles in UIs, enabling color codes and styling.\n- \ud83c\udf9e\ufe0f Added animation controllers to entities for smoother client-side movement animations.\n- \ud83e\uddea Introduced new glyph textures, primarily for debugging purposes.\n\n**Server Side Changes:**\n- \u2b06\ufe0f Updated the server and most libraries to PM5.\n- \ud83d\udea7 Work in progress: Dungeons not functional with rotated variants of rooms; transitioning to new tools based on EasyEdit and its data.\n- \ud83c\udfd7\ufe0f Expanded ECS with new components for improved mob behavior.\n- \ud83d\udc1b Fixed bugs related to dynamic entity registration on the server.\n- \ud83d\udd00 Restructured ticking system in ECS for dynamic tick speed, reducing server load.\n- \ud83d\udee0\ufe0f Resolved race condition/crash related to rapid session deconstruction.\n- \ud83d\uddc4\ufe0f Fixed database statements for the quest system.\n- \ud83c\udfa8 Added missing custom icons (glyphs) and introduced new ones.\n\nStay tuned for more exciting updates! \ud83d\ude80\n@\ud83d\udd14 Development Update\n\n[...]", "date": "2023-11", "category": "UIs, Story and World", "kind": "image", "src": "media/discord/uis-story-and-world-quest-book.gif", "thumb": "media/discord/uis-story-and-world-quest-book-thumb.png", "pixel": true, "types": ["Render"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udcbbdevelopment-updates - \ud83d\udcd6Quest Book & Player List - _t_1683188760_D_ [1103599947749806130].json_Files/image-53be1bcd08dbec50.png", "title": "Quest Book & Player List #1", "desc": "\ud83d\udd16 We are happy to announce a new update! \ud83e\udd73\n\nWe have added the **Quest Book Interface** for an improved experience in tracking and managing your quests. You can now easily select which quest to track and check the details of each quest. \ud83d\udcd4\n\nAdditionally, we have rewritten the NPC dialogue file and layout for a smoother interaction with the game world. \ud83d\udcac\n\nWe have also implemented the **Player List Button** in the pause screen, making it easier to see who is currently in the game with you. \ud83d\udc65\n\nAs always, we have included a full changelog below:\n\n\u2728 _Full changelog:_\n\n\ud83d\udcdc Added the Quest Book Interface\n\ud83d\udcdd Rewritten the NPC dialogue file and layout\n\ud83c\udfae Implemented the Player List Button in the pause screen\n\nStay tuned for more updates and videos on our **YouTube channel** [@WolvesFortress](http://youtube.com/@wolvesfortress) ! \ud83c\udfac\n\nSee you soon for another @\ud83d\udd14 Development Update!", "date": "2023-05", "category": "Quest Book & Player List", "kind": "image", "src": "media/discord/quest-book-player-list-1.jpg", "thumb": "media/discord/quest-book-player-list-1-thumb.jpg", "pixel": false, "types": ["Screenshot"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udcbbdevelopment-updates - \ud83e\udd70 Bringing Characters to Life_ Emotions & World-Building \ud83e\udd94 - _t_1730923260_D_ [1303812354085228634].json_Files/spirits_entities-d20ceddc4474a509.png", "title": "Spirits Entities", "desc": "### \ud83d\udcdc **New Story Character & Nature Spirits**\nMeet **The Professor** - father of the main character and an important part of the story. Alongside him, we\u2019re introducing two of the mystical **nature spirits**:\n- \ud83c\udf44 **Mushroom Mage**\n- \ud83c\udf43 **Leafy Spirit**\n\n### \ud83e\udd94 **New Ambient Creatures**\nAdding more life to our world, we've introduced new ambient creatures! Keep an eye out for:\n- \ud83d\udc26 **Crows**\n- \ud83d\udd4a\ufe0f **Doves**\n- \ud83e\udd94 **Hedgehogs**\n\n[...]", "date": "2024-11", "category": "Bringing Characters to Life: Emotions & World-Building", "kind": "image", "src": "media/discord/bringing-characters-to-life-emotions-world-building-spirits-entities.jpg", "thumb": "media/discord/bringing-characters-to-life-emotions-world-building-spirits-entities-thumb.jpg", "pixel": false, "types": ["Render"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udcbbdevelopment-updates - \ud83c\udf33 Forest Ambiance_ Wildlife, Foliage & Effects \u2728 - _t_1751029140_D_ [1388141960291680256].json_Files/sprucewood_stem-dcee5df782566bac.png", "title": "Sprucewood Stem", "desc": "", "date": "2025-06", "category": "Forest Ambiance: Wildlife, Foliage & Effects", ": "image", "src": "media/discord/sneak-peeks-4.jpg", "thumb": "media/discord/sneak-peeks-4-thumb.jpg", "pixel": false, "types": ["Screenshot"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udc3a\ud83c\udff0 Information - \ud83d\udc40sneak-peeks [1361440020573065421].json_Files/2025-04-14_23.26.19-5bb690d80d57cca3.png", "title": "sneak-peeks #5", "desc": "\ud83d\ude48 i forgot I've gotten quite far with the city - here the marketplace and the church \n@\ud83d\udd14 Development Update\n\n[...]", "date": "2025-04", "category": "sneak-peeks", "kind": "image", "src": "media/discord/sneak-peeks-5.jpg", "thumb": "media/discord/sneak-peeks-5-thumb.jpg", "pixel": false, "types": ["Screenshot"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udc3a\ud83c\udff0 Information - \ud83d\udc40sneak-peeks [1361440020573065421].json_Files/2025-04-20_06-4874eca9db14446d.png", "title": "sneak-peeks #6", "desc": "Moved some of the buildings around and started decorating a bit! @\ud83d\udd14 Development Update\n\n[...]", "date": "2025-04", "category": "sneak-peeks", "kind": "image", "src": "media/discord/sneak-peeks-6.jpg", "thumb": "media/discord/sneak-peeks-6-thumb.jpg", "pixel": false, "types": ["Screenshot"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udc3a\ud83c\udff0 Information - \ud83d\udc40sneak-peeks [1361440020573065421].json_Files/2025-04-20_06-92c7e345f4ef66fb.png", "title": "sneak-peeks #7", "desc": "Moved some of the buildings around and started decorating a bit! @\ud83d\udd14 Development Update\n\n[...]", "date": "2025-04", "category": "sneak-peeks", "kind": "image", "src": "media/discord/sneak-peeks-7.jpg", "thumb": "media/discord/sneak-peeks-7-thumb.jpg", "pixel": false, "types": ["Screenshot"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udc3a\ud83c\udff0 Information - \ud83d\udc40sneak-peeks [1361440020573065421].json_Files/image-153-e642204ded696a8a.png", "title": "sneak-peeks #8", "desc": "Light bloom!\n@\ud83d\udd14 Development Update\n\n[...]", "date": "2025-04", "category": "sneak-peeks", "kind": "image", "src": "media/discord/sneak-peeks-8.png", "thumb": "media/discord/sneak-peeks-8-thumb.png", "pixel": true, "types": ["UI"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "discord/showcases/WolvesFortress - \ud83d\udc3a\ud83c\udff0 Information - \ud83d\udc40sneak-peeks [1361440020573065421].json_Files/image-94dbfc4d7fa9751f.png", "title": "sneak-peeks #9", "desc": "Improved the ECS for more performance & Added some new components (example: actors looking around at random!)\nvideo follows in  bit\n@\ud83d\udd14 Development Update\n\n[...]", "date": "2025-04", "category": "sneak-peeks", "kind": "image", "src": "media/discord/sneak-peeks-9.jpg", "thumb": "media/discord/sneak-peeks-9-thumb.jpg", "pixel": false, "types": ["Screenshot"], "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "youtube/1fbRYUpwLB8", "kind": "youtube", "yt": "1fbRYUpwLB8", "title": "\ud83c\udfafQuests! -\ud83d\udc3a\ud83c\udff0WolvesFortress Dev Update 1/5/23", "thumb": "media/discord/yt-1fbryupwlb8.jpg", "src": "", "types": ["Video"], "desc": "\ud83d\udd16 We are happy to announce: **Quests** have been successfully implemented! \ud83e\udd73\n\nThey can now dynamically get generated and added, and all the things like claiming and completing them are working fine! \u2705\nWith that, objectives have also been added \ud83d\udd0e Those can range from simple things like _\"Walk around for a bit\ud83d\udeb6\u200d\u2640\ufe0f\"_ to complex things like _\"Get 5 `electroplasm`\ud83d\udfe1 from defeating `Ghusts`\ud83d\udc7b with an `electric`\u26a1 spell in a `wet`\ud83d\udca6 dungeon\"_ \ud83d\udc40 \n\nUp next would be the quest log book \ud83d\udcd4 where you can i.e. select what quest to track \ud83e\udded or check the details of a quest.\nhttps://cdn.discordapp.com/attachments/960245108039614464/1066454743544758363/image.png\nhttps://cdn.discordapp.com/attachments/960245108039614464/1066454743838380094/image.png\nhttps://cdn.discordapp.com/attachments/960245108039614464/1066454744123572304/image.png\nhttps://cdn.discordapp.com/attachments/960245108039614464/1066454744484302958/image.png\n\nAs we usually do, \ud83c\udfac we will post a video about this development update on our **YouTube channel** \u003chttp://youtube.com/@wolvesfortress>\nhttps://youtu.be/1fbRYUpwLB8\n\n\u2728 _Full changelog:_\n\n\ud83d\udcdc The buttons in the quest UI now claim and (as for now) directly start a quest\n\ud83d\udcbe Quests can be saved to disk\n\ud83c\udfaf Added quest objectives with efficient progress checking\n\ud83d\udcdd Improved text formatting & used new icons\n\u2755 Added debug command for quests and quest UIs\n\ud83d\udd28 Fixed spawning the smith on the server\n\ud83c\udf1f Added some new icons (\ud83e\uddeapotion, \ud83d\udcd4book, \ud83d\udc5cbag, \u25b6\ufe0fplay, \u23f8\ufe0fpause, \u23f9\ufe0fstop, \ud83d\udd30bullet point) and fixed offsets\n\n@\ud83d\udd14 Development Update \n\ud83e\udd2b*Psst: highlighted words may be spoilers hehe (and `Ghust` isn't a typo)*\n\n[...]", "date": "YouTube", "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "youtube/6FyeGtQQt5I", "kind": "youtube", "yt": "6FyeGtQQt5I", "title": "\ud83c\udfd4 Terraformed the starter village! #minecraft", "thumb": "media/discord/yt-6fyegtqqt5i.jpg", "src": "", "types": ["Video"], "desc": "Terraformed the terrain, cleaned things up, decorated a bit and sorted out a block palette now!\nhttps://youtu.be/6FyeGtQQt5I\n@\ud83d\udd14 Development Update \n_(my back hurts \ud83d\ude23 :danded:)_\n\n[...]", "date": "YouTube", "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "youtube/f9fYcQ3CXcc", "kind": "youtube", "yt": "f9fYcQ3CXcc", "title": "\ud83d\udcacAnimated Dialogues -\ud83d\udc3a\ud83c\udff0WolvesFortress Dev Update 3/5/32", "thumb": "media/discord/yt-f9fycq3cxcc.jpg", "src": "", "types": ["Video"], "desc": "Great news everyone! We've finally gotten dialogues to work again! \ud83c\udf89 \nThe implementation we used (`NpcDialog`) was not up to date with the new changes in Minecraft, but we just fixed that! \ud83d\ude01\n\n\ud83d\udc40 Just for fun, we've tried animating the dialogue text. It looks awesome! There's even a setting for the text speed. \ud83e\udd16\n\n\ud83d\udcac Buttons are hidden until the text completes, and adding a skip button would be easy as well. \ud83d\ude4c\n\n:think: We're currently discussing whether or not we should use this feature on our server, since it could cause high network load (because it resends the dialogue each tick).\n\n\ud83c\udfac This time we got a video available directly on our YouTube channel \u003chttp://youtube.com/@wolvesfortress>: https://www.youtube.com/watch?v=f9fYcQ3CXcc&list=PLC4CnbLFWYgKG0w6w8PiRAuyO23xyjE5B&index=1\n\n\u2728 Full changelog:\n\n\ud83d\udcda Updated the `NpcDialog` library to work with 1.19.2+\n\ud83d\udcdc Added branching dialogues with conditional buttons\n\ud83d\udcdd Added a way to animate the text & added a text speed setting\n\n@\ud83d\udd14 Development Update\n\n[...]", "date": "YouTube", "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "youtube/4Qqz4FNPgRo", "kind": "youtube", "yt": "4Qqz4FNPgRo", "title": "\ud83d\udcacAnimated Dialogues at different speeds -\ud83d\udc3a\ud83c\udff0WolvesFortress Dev Update 3/5/23", "thumb": "media/discord/yt-4qqz4fnpgro.jpg", "src": "", "types": ["Video"], "desc": "@\ud83d\udd14 Development Update \nRe-coded the code for the text speed. Here is an updated video. I did notice a flaw in the \"words\" speed option, but that is now fixed as well, just not in the video yet. https://www.youtube.com/watch?v=4Qqz4FNPgRo&list=PLC4CnbLFWYgKG0w6w8PiRAuyO23xyjE5B&index=1", "date": "YouTube", "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "youtube/AaoP9wdwsbY", "kind": "youtube", "yt": "AaoP9wdwsbY", "title": "\ud83d\udcd6 Quest Book Item - \ud83d\udc3a\ud83c\udff0WolvesFortress Dev Update 3/31/24", "thumb": "media/discord/yt-aaop9wdwsby.jpg", "src": "", "types": ["Video"], "desc": "## \ud83d\udcda Quest Book & Particles Galore!\nOur team has aquired new knowledge that plays a great role in immersion: Now we can add animated 3D items, which smoothly switch between their states and emit particles! \u2728 We've implemented animations and attachables to the quest book to bring it to life, which you can check out in action here: [Animated Quest Book](https://youtu.be/AaoP9wdwsbY?list=PLC4CnbLFWYgKG0w6w8PiRAuyO23xyjE5B). We've also added some sweet particle effects for the world, including a swarm of flies and magic effects.\n## \ud83d\udcd6 Quest Board & Dialogue Updates \nSome significant updates to the quest system were done, including fixing a bug where the player quest status was the same for everyone (whoopsie \ud83d\ude05). The quest board now only displays available quests to the player, and the quest book shows claimed quests now, and has a functional track button. Entries are now also ordered by status, with tracked quests on top. Additionally, we've fixed NPC dialogues to work with all text speeds and have their nested dialogue options functional again - even when text animation is disabled.\n## \ud83c\udfa8 Concept Art & Castle Designs\nWe've started building and painting some fantastic concepts for the layout of cities and nations, architecture and style of structures like the main nation's castle - which we'll showcase in a future update. We're excited to have @\ud83d\udc51 Nova | Tynamo King \ud83d\udc51 on board as our new coordinator for the builder team, who will help us bring these designs to life, and assist us in crafting a fantastic world for you to explore! Our team has been experimenting with Axiom (a revolutionary Minecraft world editing mod!) to create some assets and brainstorm layouts and designs, bringing organic structures to life with it's powerfull tools. Check out these cool mushrooms! \ud83c\udf44\n\n[...]", "date": "YouTube", "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "youtube/SlovfAd4M0s", "kind": "youtube", "yt": "SlovfAd4M0s", "title": "\ud83d\udd87Node-Based Game Scene Scripting\ud83c\udf9e", "thumb": "media/discord/yt-slovfad4m0s.jpg", "src": "", "types": ["Video"], "desc": "## \ud83c\udfa5 Advanced Camera Controls\n\nBuilding on our previous work, we've expanded our camera system to utilize Minecraft's latest camera features. Now we can create truly cinematic experiences:\n\n- Camera transitions like fades to black\n- Dynamic targeting camera that follows characters\n- Custom free-cam at static position\n- Seamless integration with our scripting system\n\n[Test script scene with camera controls](https://youtu.be/SlovfAd4M0s)\n\n[...]", "date": "YouTube", "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "youtube/mNoyXFRrNOY", "kind": "youtube", "yt": "mNoyXFRrNOY", "title": "\ud83e\udded Navigation Mesh & Pathfinding - \ud83d\udc3a\ud83c\udff0WolvesFortress Dev Update 5/30/24", "thumb": "media/discord/yt-mnoyxfrrnoy.jpg", "src": "", "types": ["Video"], "desc": "## \ud83e\udded Navigation Mesh: A New Era And Leap In Development\nWe're thrilled to introduce our new navigation mesh system, which allows entities like enemies and NPCs to move around the dungeon with ease. This system, built upon Muqsit's excellent work (thanks for the contribution, Muqsit! \ud83d\ude4f), allows quickly generating a navigation mesh for entities like enemies and NPCs/companions for where they can walk, has features like dynamic scaling of the grid size (to adjust for entity size for example) and also has options that allow us to display debugging particles to visualize the grid, edges, vertices and connected nodes to fix flaws. This awesome addition finally enables us to figure out spawning positions for items, enemies, target locations, line-of-sight checks and attacks. You can check out the original and amazing code at [Muqsit's Gist on GitHub](https://gist.github.com/Muqsit/3fb8521ea5af2ca0748d09855fbaf5c0) - *be sure to leave a star \u2b50\ud83d\ude09*. We've modified it a bit to suit our needs and to work with the dungeon generator and pathfinder - there are still some minor flaws where some node connections are missing, but those aren't too critical since the pathfinder takes control of the actual movement.\n## \ud83d\uddfa Pathfinding: Smoother Than Ever\nThe async pathfinder, courtesy of @Matze (thanks, Matze! \ud83d\udc4d), has been re-implemented and made work with the navmesh. We've put it to the test with our Nature Slime. Watch it walk from one navmesh node to another in our [testing video](https://www.youtube.com/watch?v=mNoyXFRrNOY&list=PLC4CnbLFWYgKG0w6w8PiRAuyO23xyjE5B&index=1). This system ensures that movement is smooth, logical and efficient, finally allowing our creatures and inhabitants to navigate the world with ease! The project can be found on [GitHub](https://github.com/Matze997/Pathfinder).\n\n[...]", "date": "YouTube", "project": "WolvesFortress", "anims": [], "featured": false, "wip": false, "pinned": false, "fav": false}, {"id": "wolvesfortress/owl", "kind": "model", "anims": ["animation.a.move", "animation.a.base_pose2", "animation.a.move2"], "project": "WolvesFortress", "featured": false, "wip": true, "desc": "", "title": "Owl", "src": "models/wolvesfortress-owl.5480389c.json", "thumb": "thumbs/wolvesfortress-owl.fbb01a85.png", "types": ["Model", "Animation"], "pinned": false, "fav": false}]}</script>
<script>
(async () => {
  await window.libsReady;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const data = JSON.parse($('manifest').textContent);
  const items = data.items;
  const EDIT = location.hash === '#edit';
  // full edit mode only in a browser that holds the owner's GitHub token (or on the local editor server)
  const CAN_EDIT = EDIT && (location.port === '8642' || (() => { try { return !!localStorage.getItem('gh-token'); } catch (e) { return false; } })());
  // live corrections: overrides.json next to the page (written by edit mode) is applied on top of the built data
  let OVR = {}, ADDED = [];
  try { const r = await fetch('overrides.json', { cache: 'no-store' }); if (r.ok) OVR = await r.json(); } catch (e) {}
  try { const r = await fetch('added.json', { cache: 'no-store' }); if (r.ok) ADDED = await r.json(); } catch (e) {}
  if (ADDED.length) {
    const have = new Set(items.map(i => i.id)); let at = 0;
    while (at < items.length && (items[at].pinned || items[at].fav)) at++;
    items.splice(at, 0, ...ADDED.filter(a => !have.has(a.id)).map(a => ({ anims: [], types: [], desc: '', ...a })));
  }
  function applyOverride(i, o) {
    for (const k of ['title', 'desc', 'project', 'category']) if (k in o) i[k] = o[k];
    if (Array.isArray(o.types)) i.types = [...o.types];
    for (const k of ['wip', 'pinned', 'hidden']) if (k in o) i[k] = !!o[k];
  }
  for (const i of items) if (OVR[i.id]) applyOverride(i, OVR[i.id]);
  for (const name of new Set(items.map(i => i.project))) if (name && !data.projects.some(p => p.name === name)) data.projects.push({ name, desc: '' });
  if (!CAN_EDIT) for (let n = items.length - 1; n >= 0; n--) if (items[n].hidden) items.splice(n, 1);
  items.sort((a, b) => (!!a.wip - !!b.wip) || (!!b.pinned - !!a.pinned));  // stable: keeps the built order otherwise
  const ICON_LINK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>';
  $('bio').textContent = data.about.bio;
  $('links').innerHTML = data.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${l.icon ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${l.icon}"/></svg>` : ICON_LINK}${esc(l.name)}</a>`).join('');
  $('foot').textContent = data.about.footer || '';

  // tiny, safe Markdown for Discord post text: headings, lists, bold/italic, code, links (escapes first)
  function md(src) {
    // Discord-style escapes (\* \_ \` \~ \| \\ ...) become placeholders first, so they never trigger formatting
    const inline = raw => { const kept = [];
      const s = raw.replace(/\\([\\*_`~|\[\]()#>-])/g, (m, c) => { kept.push(c); return '\u0001' + (kept.length - 1) + '\u0002'; });
      return fmt(s).replace(/\u0001(\d+)\u0002/g, (m, n) => esc(kept[+n])); };
    const fmt = s => esc(s)
      .replace(/&lt;a?:\w+:\d+&gt;/g, '').replace(/&lt;[@#][!&]?\d+&gt;/g, '')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/__([^_]+)__/g, '<u>$1</u>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    let out = '', list = false;
    for (const raw of String(src).split(String.fromCharCode(10))) {
      const line = raw.trim();
      const li = line.match(/^[-*•]\s+(.*)/), hd = line.match(/^#{1,3}\s+(.*)/);
      if (!li && list) { out += '</ul>'; list = false; }
      if (li) { if (!list) { out += '<ul>'; list = true; } out += `<li>${inline(li[1])}</li>`; }
      else if (hd) out += `<h4>${inline(hd[1])}</h4>`;

                       back: new THREE.MeshLambertMaterial({ color: 0xbdbdbd, side: THREE.BackSide, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 }) };
    const mats = (g.materials || []).map(m => {
      const p = m.pbrMetallicRoughness || {}, bt = p.baseColorTexture, c = p.baseColorFactor || [1, 1, 1, 1];
      const map = bt != null && g.textures ? texs[g.textures[bt.index].source] : null;
      // two passes: back faces pushed back in depth, front faces win ties -> planes keep both sides without z-fighting
      const blend = m.alphaMode === 'BLEND';
      const opt = blend ? { map, color: new THREE.Color(c[0], c[1], c[2]), transparent: true, depthWrite: false, alphaTest: 0.01 }
                        : { map, color: new THREE.Color(c[0], c[1], c[2]), alphaTest: 0.05 };
      return { front: new THREE.MeshLambertMaterial({ ...opt, side: THREE.FrontSide }),
               back: new THREE.MeshLambertMaterial({ ...opt, side: THREE.BackSide, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 }) };
    });
    const objs = g.nodes.map((n, i) => {
      const o = new THREE.Group(); o.name = 'n' + i;
      if (n.matrix) new THREE.Matrix4().fromArray(n.matrix).decompose(o.position, o.quaternion, o.scale);
      else { if (n.translation) o.position.fromArray(n.translation); if (n.rotation) o.quaternion.fromArray(n.rotation); if (n.scale) o.scale.fromArray(n.scale); }
      if (n.mesh != null) for (const p of g.meshes[n.mesh].primitives) {
        const geo = new THREE.BufferGeometry(), at = p.attributes;
        geo.setAttribute('position', new THREE.BufferAttribute(acc(at.POSITION), 3));
        if (at.TEXCOORD_0 != null) geo.setAttribute('uv', new THREE.BufferAttribute(acc(at.TEXCOORD_0), 2));
        if (p.indices != null) geo.setIndex(new THREE.BufferAttribute(acc(p.indices), 1));
        if (at.NORMAL != null) geo.setAttribute('normal', new THREE.BufferAttribute(acc(at.NORMAL), 3)); else geo.computeVertexNormals();
        const m = mats[p.material] || fallback;
        const tr = m.front.transparent ? 2 : 0;  // translucent parts draw after everything opaque
        const back = new THREE.Mesh(geo, m.back); back.renderOrder = tr; o.add(back);
        const front = new THREE.Mesh(geo, m.front); front.renderOrder = tr + 1; o.add(front);
      }
      return o;
    });
    g.nodes.forEach((n, i) => (n.children || []).forEach(c => objs[i].add(objs[c])));
    const r = new THREE.Group(); (g.scenes[g.scene || 0].nodes).forEach(i => r.add(objs[i]));
    clips = (g.animations || []).map(a => new THREE.AnimationClip(a.name, -1, a.channels.map(ch => {
      const s = a.samplers[ch.sampler], t = acc(s.input), v = acc(s.output), nm = 'n' + ch.target.node;
      if (ch.target.path === 'rotation') return new THREE.QuaternionKeyframeTrack(nm + '.quaternion', t, v);
      if (ch.target.path === 'translation') return new THREE.VectorKeyframeTrack(nm + '.position', t, v);
      if (ch.target.path === 'scale') return new THREE.VectorKeyframeTrack(nm + '.scale', t, v);
      return null;
    }).filter(Boolean)));
    // frame the model (front = -Z in Blockbench)
    const box = new THREE.Box3().setFromObject(r), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
    r.position.sub(center);
    const d = Math.max(size.x, size.y, size.z, 0.01) / (2 * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2))) * (opts.distance || 1.45) * zoom;
    cam.position.set(d * (opts.camX ?? 0.55), d * 0.35, -d * (opts.camZ ?? 0.78)); cam.near = d / 100; cam.far = d * 20; cam.updateProjectionMatrix();
    ctl.target.set(0, 0, 0); ctl.autoRotate = true; ctl.update();
    root = r; scene.add(r); mixer = new THREE.AnimationMixer(r); resize();
  }
  async function loadParticle(url, tex, zoom = 1) {
    const my = ++token;
    const json = await (await fetch(url)).json();
    if (my !== token) return;
    clear();
    if (!window.Wintersky) throw new Error('Wintersky did not load');
    wscene = new Wintersky.Scene({ fetchTexture: () => tex || undefined });
    emitter = new Wintersky.Emitter(wscene, json, { loop_mode: 'looping' });
    const r = new THREE.Group(); r.add(wscene.space);
    cam.position.set(4 * zoom, 3 * zoom, -6 * zoom); cam.near = 0.01; cam.far = 500; cam.updateProjectionMatrix();
    ctl.target.set(0, 1, 0); ctl.autoRotate = true; ctl.update();
    root = r; scene.add(r); resize();
    emitter.playLoop();
  }
  function playOnce(name, back, after) {
    if (!mixer) return; const c = clips.find(c => c.name === name); if (!c) return;
    mixer.stopAllAction(); const act = mixer.clipAction(c); act.reset(); act.setLoop(THREE.LoopRepeat, c.duration < 1.5 ? 2 : 1); act.play();
    const done = e => { if (e.action === act) { mixer.removeEventListener('finished', done); if (back) play(back); if (after) after(); } };
    mixer.addEventListener('finished', done);
  }
  function play(name) {
    if (!mixer) return; mixer.stopAllAction();
    const c = clips.find(c => c.name === name) || clips[0]; if (c) mixer.clipAction(c).play();
  }
  return { load, loadParticle, play, playOnce, clear: () => { token++; clear(); } };
}
